<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频文件管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
            background-color: #f8f9fa;
        }

        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        }

        .table th,
        .table td {
            vertical-align: middle;
        }

        .action-buttons button {
            margin-right: 5px;
        }

        .upload-section {
            margin-bottom: 20px;
            padding: 20px;
            background-color: #e9ecef;
            border-radius: 8px;
        }

        .search-bar {
            margin-bottom: 20px;
        }

        .pagination-controls {
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 class="mb-4 text-center">视频文件管理</h1>

        <!-- 上传区域 -->
        <div class="upload-section">
            <h2>上传新视频</h2>
            <form id="uploadForm">
                <div class="mb-3">
                    <label for="videoFile" class="form-label">选择视频文件</label>
                    <input type="file" class="form-control" id="videoFile" accept="video/*" required>
                </div>
                <div class="mb-3">
                    <label for="videoDescription" class="form-label">文件描述</label>
                    <input type="text" class="form-control" id="videoDescription" placeholder="请输入视频描述">
                </div>
                <button type="submit" class="btn btn-primary">开始上传</button>
            </form>
        </div>

        <!-- 搜索栏 -->
        <div class="search-bar input-group mb-3">
            <input type="text" id="searchInput" class="form-control" placeholder="搜索文件名称或描述...">
            <button class="btn btn-outline-secondary" type="button" id="searchButton">搜索</button>
        </div>

        <!-- 视频列表 -->
        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th>文件名称</th>
                    <th>文件描述</th>
                    <th>上传时间</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="videoTableBody">
                <!-- 动态生成列表项 -->
            </tbody>
        </table>

        <!-- 分页控件 -->
        <nav aria-label="Page navigation" class="pagination-controls">
            <ul class="pagination justify-content-center" id="pagination">
                <!-- 动态生成分页按钮 -->
            </ul>
        </nav>
    </div>

    <!-- 播放模态框 -->
    <div class="modal fade" id="videoPlayerModal" tabindex="-1" aria-labelledby="videoPlayerModalLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="videoPlayerModalLabel">播放视频</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <video id="videoPlayer" width="100%" controls autoplay>
                        <source src="" type="video/mp4">
                        您的浏览器不支持Video标签。
                    </video>
                    <p id="videoPlayerDescription" class="mt-2"></p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let allVideos = []; // Store all videos fetched from backend
        let currentVideos = []; // Videos currently displayed (after search/pagination)
        let currentPage = 1;
        const itemsPerPage = 5;

        // Fetch videos from backend
        async function fetchVideosAPI(searchTerm = '') {
            try {
                // Modify the API endpoint and parameters as needed
                const response = await fetch(`/video_cliper/list_videos`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                if (data.success) {
                    allVideos = data.data; // Assuming backend returns { success: true, data: [...] }
                    applySearchAndPagination(searchTerm);
                } else {
                    console.error('Backend returned error:', data.msg);
                    alert('无法加载视频列表：' + data.msg);
                }
            } catch (error) {
                console.error('Error fetching videos:', error);
                alert('无法加载视频列表，请稍后再试。');
            }
        }
        // Initial load from API
        fetchVideosAPI();


        const videoTableBody = document.getElementById('videoTableBody');
        const paginationUl = document.getElementById('pagination');
        const searchInput = document.getElementById('searchInput');
        const searchButton = document.getElementById('searchButton');
        const uploadForm = document.getElementById('uploadForm');
        const videoPlayer = document.getElementById('videoPlayer');
        const videoPlayerDescription = document.getElementById('videoPlayerDescription');
        const videoPlayerModal = new bootstrap.Modal(document.getElementById('videoPlayerModal'));

        // 获取文件输入和描述输入元素
        const videoFileInput = document.getElementById('videoFile');
        const videoDescriptionInput = document.getElementById('videoDescription');
        const uploadButton = uploadForm.querySelector('button[type="submit"]'); // 获取上传按钮

        // 为文件输入添加change事件监听器
        videoFileInput.addEventListener('change', (event) => {
            // 获取选中的文件
            const file = event.target.files[0];
            if (file) {
                // 将文件名填充到文件描述输入框
                videoDescriptionInput.value = file.name;
            }
        });

        function renderTable(videosToRender) {
            videoTableBody.innerHTML = '';
            if (videosToRender.length === 0) {
                videoTableBody.innerHTML = '<tr><td colspan="4" class="text-center">没有找到匹配的视频</td></tr>';
                return;
            }
            videosToRender.forEach(video => {
                const row = `
                    <tr>
                        <td>${video.name}</td>
                        <td>${video.description}</td>
                        <td>${video.uploadTime}</td>
                        <td class="action-buttons">
                            <button class="btn btn-sm btn-danger" onclick="deleteVideo('${video.id}')">删除</button>
                            <button class="btn btn-sm btn-info" onclick="playVideo('${video.name}', '${video.description}', '${video.originalUrl}', '${video.editedUrl}', '原视频')">原视频</button>
                            ${video.status === '2' ?
                        `<button class="btn btn-sm btn-warning" onclick="playVideo('${video.name}', '${video.description}', '${video.originalUrl}', '${video.editedUrl}', '剪辑后')">剪辑后</button>` :
                        video.status === '1' ?
                            `<button class="btn btn-sm btn-secondary" disabled>处理中</button>` :
                            video.status === '3' ?
                                `<button class="btn btn-sm btn-warning" onclick="editVideo('${video.id}')">处理失败重新剪辑</button>` :
                                video.status === '0' ?
                                    `<button class="btn btn-sm btn-warning" onclick="editVideo('${video.id}')">剪辑</button>` :
                                    '' // Default case
                    }
                        </td>
                    </tr>
                `;
                videoTableBody.innerHTML += row;
            });
        }

        function renderPagination(totalItems) {
            paginationUl.innerHTML = '';
            const totalPages = Math.ceil(totalItems / itemsPerPage);
            if (totalPages <= 1) return;

            for (let i = 1; i <= totalPages; i++) {
                const li = document.createElement('li');
                li.className = `page-item ${i === currentPage ? 'active' : ''}`;
                const a = document.createElement('a');
                a.className = 'page-link';
                a.href = '#';
                a.innerText = i;
                a.addEventListener('click', (e) => {
                    e.preventDefault();
                    currentPage = i;
                    displayPage();
                });
                li.appendChild(a);
                paginationUl.appendChild(li);
            }
        }

        function applySearchAndPagination(searchTerm = '') {
            const filteredVideos = allVideos.filter(video =>
                video.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                video.description.toLowerCase().includes(searchTerm.toLowerCase())
            );
            currentVideos = filteredVideos;
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const paginatedVideos = currentVideos.slice(startIndex, endIndex);
            renderTable(paginatedVideos);
            renderPagination(currentVideos.length);
        }

        function displayPage() {
            // This function is now mainly for pagination after search
            applySearchAndPagination(searchInput.value);
        }

        window.deleteVideo = async function (id) { // Changed to async for API call example
            if (confirm('确定要删除这个视频吗？')) {
                // Example: Delete video from backend
                try {
                    // Assuming a DELETE endpoint like /video_cliper/delete_video/{id}
                    const response = await fetch(`/video_cliper/del_video`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ origin_video_uid: id })
                    });
                    if (!response.ok) {
                        const errorData = await response.json(); // Or response.text()
                        throw new Error(`HTTP error! status: ${response.status}, message: ${errorData.detail || response.statusText}`);
                    }
                    const result = await response.json();
                    if (result.success) {
                        // If successful, refetch data and re-render
                        fetchVideosAPI(searchInput.value); // Refetch with current search term
                        alert('视频已成功删除');
                    } else {
                        alert(`删除视频失败: ${result.msg}`);
                    }

                } catch (error) {
                    console.error('Error deleting video:', error);
                    alert(`删除视频失败: ${error.message}`);
                }
            }
        }

        window.playVideo = function (name, description, originalUrl, editedUrl, type) {
            document.getElementById('videoPlayerModalLabel').innerText = `播放视频: ${name} (${type})`;
            // Use the correct URL based on type
            videoPlayer.src = type === '原视频' ? originalUrl : editedUrl; // In a real app, ensure this URL is safe and valid
            videoPlayerDescription.innerText = description;
            videoPlayerModal.show();
            // Handle cases where video might not load, e.g., placeholder or error message
            videoPlayer.onerror = () => {
                videoPlayer.parentElement.innerHTML = '<p class="text-danger">抱歉，视频加载失败或示例视频不存在。</p>';
            };
        }

        window.editVideo = async function (videoId) {
            try {
                const response = await fetch('/video_cliper/start_video_cliper', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ origin_video_uid: videoId }) // Assuming backend expects origin_video_uid
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(`HTTP error! status: ${response.status}, message: ${errorData.detail || response.statusText}`);
                }

                const result = await response.json();
                if (result.success) {
                    alert('视频剪辑任务已启动！');
                    // Refetch video list to update status in the table
                    fetchVideosAPI(searchInput.value);
                } else {
                    alert(`启动视频剪辑任务失败: ${result.msg}`);
                }

            } catch (error) {
                console.error('Error starting video cliper:', error);
                alert(`启动视频剪辑任务失败: ${error.message}`);
            }
        }

        searchButton.addEventListener('click', () => {
            currentPage = 1; // Reset to first page on new search
            applySearchAndPagination(searchInput.value);
        });

        searchInput.addEventListener('keypress', (event) => {
            if (event.key === 'Enter') {
                searchButton.click();
            }
        });

        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const fileInput = document.getElementById('videoFile');
            const descriptionInput = document.getElementById('videoDescription');

            if (fileInput.files.length === 0) {
                alert('请选择一个视频文件');
                return;
            }

            // 上传视频到后端
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);  // 注意参数名改为'file'
            formData.append('description', descriptionInput.value || '无描述');

            // 禁用按钮并更新文本
            uploadButton.disabled = true;
            uploadButton.innerText = '上传中...';

            try {
                const response = await fetch('/video_cliper/upload_video', {
                    method: 'POST',
                    body: formData,
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(`HTTP error! status: ${response.status}, message: ${errorData.detail || response.statusText}`);
                }

                const uploadedVideo = await response.json();
                // allVideos.unshift(uploadedVideo.data); // 添加到主列表，注意后端返回的数据结构
                // applySearchAndPagination(searchInput.value); // 刷新当前视图，应用搜索和分页
                // currentVideos = [...mockVideos]; // 刷新当前视图
                // currentPage = 1;
                fetchVideosAPI(searchInput.value); // Refetch with current search term
                // displayPage();
                uploadForm.reset();
                alert('视频上传成功！');
            } catch (error) {
                console.error('Error uploading video:', error);
                alert(`视频上传失败: ${error.message}`);
            } finally {
                // 恢复按钮状态
                uploadButton.disabled = false;
                uploadButton.innerText = '开始上传';
            }
        });

    </script>
</body>

</html>
